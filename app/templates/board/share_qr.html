<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Share Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #111; --card: #1a1a1a; --text: #f2f2f2; --muted: #888; --accent: #f5c518; --border: rgba(255,255,255,0.1); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        
        .logo { font-size: 2rem; font-weight: 700; margin-bottom: 10px; }
        .logo span { color: var(--accent); }
        .subtitle { color: var(--muted); margin-bottom: 40px; }
        
        .qr-card { background: white; padding: 24px; border-radius: 16px; margin-bottom: 30px; }
        .qr-card img { width: 220px; height: 220px; }
        
        .url-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; width: 100%; max-width: 340px; }
        .url-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .url-value { font-size: 0.95rem; word-break: break-all; color: var(--accent); }
        
        .copy-btn { background: var(--accent); color: #111; border: none; padding: 16px 32px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; max-width: 340px; margin-bottom: 16px; }
        .copy-btn:active { transform: scale(0.98); }
        
        .share-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 14px 32px; border-radius: 10px; font-size: 0.95rem; font-weight: 500; cursor: pointer; width: 100%; max-width: 340px; }
        
        .instructions { margin-top: 40px; padding: 24px; background: var(--card); border-radius: 12px; width: 100%; max-width: 340px; }
        .instructions h3 { font-size: 0.9rem; margin-bottom: 16px; color: var(--accent); }
        .instructions ol { padding-left: 20px; color: var(--muted); font-size: 0.85rem; line-height: 1.8; }
        .instructions li { margin-bottom: 8px; }
        
        .copied { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #111; padding: 12px 24px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
        .copied.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="logo">🎱 <span>Pool Cue</span></div>
    <p class="subtitle">Share with your friends</p>
    
    <div class="qr-card">
        <img src="{{ url_for('display.qr_code', bar_id=bar_id) if bar_id else url_for('display.qr_code') }}" alt="QR Code">
    </div>
    
    <div class="url-box">
        <div class="url-label">Join URL</div>
        <div class="url-value" id="joinUrl">{{ join_url }}</div>
    </div>
    
    <button class="copy-btn" onclick="copyUrl()">📋 Copy Link</button>
    
    <button class="share-btn" onclick="shareUrl()">📤 Share with Friends</button>
    
    <div class="instructions">
        <h3>📱 How to Join</h3>
        <ol>
            <li>Connect to the same WiFi</li>
            <li>Scan QR code or open link</li>
            <li>Create account or join as guest</li>
            <li>Get in line to play!</li>
        </ol>
    </div>
    
    <div class="copied" id="copiedMsg">Link copied!</div>
    
    <script>
        const joinUrl = document.getElementById('joinUrl').textContent;
        
        function copyUrl() {
            navigator.clipboard.writeText(joinUrl).then(() => {
                const msg = document.getElementById('copiedMsg');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 2000);
            });
        }
        
        function shareUrl() {
            if (navigator.share) {
                navigator.share({
                    title: 'Pool Cue - Join the Queue',
                    text: 'Join me for pool!',
                    url: joinUrl
                });
            } else {
                copyUrl();
            }
        }
    </script>
</body>
</html>
