<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Queue Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #1a1a1a;
            color: #f5f5dc;
            min-height: 100vh;
            overflow: hidden;
        }
        .board {
            background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
            border: 20px solid #4a3728;
            border-radius: 8px;
            min-height: 100vh;
            padding: 30px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 2.5rem;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 3px;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .match-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            margin: 40px 0;
        }
        .player-card {
            background: rgba(74,55,40,0.3);
            border: 3px solid #4a3728;
            border-radius: 12px;
            padding: 30px 50px;
            text-align: center;
            min-width: 250px;
        }
        .player-card.king {
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212,175,55,0.3);
        }
        .player-role {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .player-name {
            font-size: 2rem;
            font-weight: bold;
            color: #f5f5dc;
        }
        .player-wins {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #d4af37;
        }
        .vs {
            font-size: 2rem;
            color: #666;
            font-style: italic;
        }
        .queue-section {
            margin-top: 40px;
        }
        .queue-title {
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }
        .queue-list {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .queue-item {
            background: rgba(74,55,40,0.2);
            border: 2px solid #4a3728;
            border-radius: 8px;
            padding: 15px 25px;
            text-align: center;
        }
        .queue-pos {
            font-size: 0.8rem;
            color: #666;
        }
        .queue-name {
            font-size: 1.1rem;
            color: #f5f5dc;
            margin-top: 5px;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666;
            font-style: italic;
            font-size: 1.5rem;
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }
        .status-dot.disconnected {
            background: #ef4444;
        }
        /* Pending confirmation overlay */
        .pending-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .pending-overlay.show {
            display: flex;
        }
        .pending-box {
            background: #2d2d2d;
            border: 3px solid #f59e0b;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        .pending-title {
            font-size: 1.5rem;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .pending-message {
            color: #ccc;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="board">
        <div class="header">
            <h1 class="title">🎱 Pool Queue</h1>
            <div class="badges" id="badges"></div>
        </div>
        
        <!-- QR Code for joining -->
        <div style="position:absolute;top:30px;right:40px;background:#fff;padding:10px;border-radius:8px;">
            <img src="/qr_code?bar_id={{ bar_id }}" style="width:120px;height:120px;display:block;" alt="Scan to Join">
            <div style="text-align:center;margin-top:6px;font-size:0.7rem;color:#333;font-family:sans-serif;">Scan to Join</div>
        </div>
        
        <div class="match-area" id="match-area">
            <div class="empty-state">Loading...</div>
        </div>
        
        <div class="queue-section">
            <div class="queue-title">Up Next</div>
            <div class="queue-list" id="queue-list"></div>
        </div>
    </div>
    
    <div class="status-bar">
        <div class="connection-status">
            <div class="status-dot" id="status-dot"></div>
            <span id="connection-text">Connected</span>
        </div>
        <div id="last-update">--</div>
    </div>
    
    <div class="pending-overlay" id="pending-overlay">
        <div class="pending-box">
            <div class="pending-title">⏳ Awaiting Confirmation</div>
            <div class="pending-message" id="pending-message">
                Result recorded. Waiting for player confirmations...
            </div>
        </div>
    </div>

    <script>
        const barId = {{ bar_id }};
        let connected = true;
        
        async function fetchState() {
            try {
                const res = await fetch(`/board/state/${barId}`);
                if (!res.ok) throw new Error('Failed to fetch');
                
                const data = await res.json();
                updateDisplay(data);
                setConnected(true);
                
            } catch (err) {
                console.error('Fetch error:', err);
                setConnected(false);
            }
        }
        
        async function fetchBadges() {
            try {
                const res = await fetch(`/board/api/match/badges/${barId}`);
                const data = await res.json();
                renderBadges(data.badges);
            } catch (err) {
                console.error('Badge fetch error:', err);
            }
        }
        
        function setConnected(status) {
            connected = status;
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('connection-text');
            
            if (status) {
                dot.classList.remove('disconnected');
                text.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Disconnected - Retrying...';
            }
        }
        
        function updateDisplay(data) {
            const matchArea = document.getElementById('match-area');
            const queueList = document.getElementById('queue-list');
            const lastUpdate = document.getElementById('last-update');
            
            lastUpdate.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
            
            // Check for pending confirmation
            if (data.active_match && data.active_match.result_winner_id && !data.active_match.result_locked) {
                document.getElementById('pending-overlay').classList.add('show');
            } else {
                document.getElementById('pending-overlay').classList.remove('show');
            }
            
            // Render match area
            if (data.king) {
                matchArea.innerHTML = `
                    <div class="player-card king">
                        <div class="player-role">👑 Shot Caller</div>
                        <div class="player-name">${escapeHtml(data.king.nickname)}</div>
                        <div class="player-wins">${data.king.wins_on_table || 0} wins on table</div>
                    </div>
                    ${data.challenger ? `
                        <div class="vs">VS</div>
                        <div class="player-card">
                            <div class="player-role">Challenger</div>
                            <div class="player-name">${escapeHtml(data.challenger.nickname)}</div>
                        </div>
                    ` : `
                        <div class="vs">...</div>
                        <div class="player-card" style="opacity: 0.5;">
                            <div class="player-role">Waiting for</div>
                            <div class="player-name">Challenger</div>
                        </div>
                    `}
                `;
            } else {
                matchArea.innerHTML = `<div class="empty-state">No players in queue. Scan QR to join!</div>`;
            }
            
            // Render waiting queue
            if (data.waiting && data.waiting.length > 0) {
                queueList.innerHTML = data.waiting.map((p, i) => `
                    <div class="queue-item">
                        <div class="queue-pos">#${i + 3}</div>
                        <div class="queue-name">${escapeHtml(p.nickname)}</div>
                    </div>
                `).join('');
            } else {
                queueList.innerHTML = '<div style="color:#666;font-style:italic;">No one waiting</div>';
            }
        }
        
        function renderBadges(badges) {
            const container = document.getElementById('badges');
            container.innerHTML = badges.map(b => `
                <div class="badge" style="background:${b.color};color:#fff;" title="${b.info}">
                    ${b.label}
                </div>
            `).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initial fetch
        fetchState();
        fetchBadges();
        
        // Poll every 3 seconds
        setInterval(fetchState, 1500);
        setInterval(fetchBadges, 3000);
    </script>
</body>
</html>
