<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Friends - Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #111111; --bg-secondary: #1a1a1a; --bg-tertiary: #222222; --border: rgba(255,255,255,0.1);
            --text-primary: #f2f2f2; --text-secondary: #888888; --text-muted: #555555; --accent: #f5c518; --success: #22c55e; --danger: #ef4444;
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding-bottom: 100px; }
        
        .header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg-primary); z-index: 100; }
        .back-btn { width: 36px; height: 36px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .header h1 { font-size: 1.2rem; font-weight: 600; }
        
        .search-box { padding: 16px 20px; }
        .search-input { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 1rem; font-family: inherit; }
        .search-input:focus { outline: none; border-color: var(--accent); }
        
        .section { padding: 0 20px; margin-bottom: 24px; }
        .section-title { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .badge { background: var(--accent); color: #111; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
        
        .friend-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; }
        .avatar { width: 48px; height: 48px; background: var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .friend-info { flex: 1; }
        .friend-name { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
        .friend-status { font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.online { background: var(--success); }
        .status-dot.playing { background: var(--accent); animation: pulse 2s infinite; }
        .status-dot.offline { background: var(--text-secondary); }
        .friend-stats { font-size: 0.75rem; color: var(--text-secondary); }
        
        .action-btns { display: flex; gap: 8px; }
        .action-btn { padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; border: none; cursor: pointer; font-family: inherit; }
        .btn-challenge { background: var(--accent); color: #111; }
        .btn-accept { background: var(--success); color: white; }
        .btn-decline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-add { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        
        .search-results { padding: 0 20px; }
        .search-result { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-primary); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 0 22px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 14px; color: var(--text-muted); text-decoration: none; font-size: 0.6rem; font-weight: 500; }
        .nav-item .icon { font-size: 1.25rem; }
        .nav-item.active { color: var(--text-primary); }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .hidden { display: none !important; }
        
        /* Invite Friends CTA */
        .invite-cta { display: flex; align-items: center; gap: 14px; margin: 0 20px 20px; padding: 16px; background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(245,197,24,0.08)); border: 1px solid rgba(34,197,94,0.3); border-radius: 12px; text-decoration: none; color: var(--text-primary); }
        .invite-icon { font-size: 2rem; }
        .invite-text { flex: 1; }
        .invite-title { font-weight: 600; font-size: 0.95rem; }
        .invite-desc { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .invite-arrow { color: var(--success); font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/player/home" class="back-btn">←</a>
        <h1>Friends</h1>
    </div>
    
    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Search players to add...">
    </div>
    
    <!-- Invite Friends CTA - prominently placed -->
    <a href="/player/invite" class="invite-cta">
        <div class="invite-icon">🎁</div>
        <div class="invite-text">
            <div class="invite-title">Invite Friends to Pool Cue</div>
            <div class="invite-desc">Earn 100 tokens for each friend who joins!</div>
        </div>
        <div class="invite-arrow">→</div>
    </a>
    
    <!-- Rivalries Link -->
    <a href="/player/rivalries" class="invite-cta" style="background:linear-gradient(135deg, rgba(239,68,68,0.12), rgba(245,197,24,0.08));border-color:rgba(239,68,68,0.3);">
        <div class="invite-icon">⚔️</div>
        <div class="invite-text">
            <div class="invite-title">Your Rivalries</div>
            <div class="invite-desc">See your top opponents and head-to-head records</div>
        </div>
        <div class="invite-arrow" style="color:var(--danger);">→</div>
    </a>
    
    <div id="searchResults" class="search-results hidden"></div>
    
    <div id="mainContent">
        <!-- Friend Requests -->
        <div class="section" id="requestsSection">
            <div class="section-title">Friend Requests <span class="badge" id="requestCount">0</span></div>
            <div id="requestsList"></div>
        </div>
        
        <!-- Playing Now -->
        <div class="section" id="playingSection">
            <div class="section-title">🎱 Playing Now</div>
            <div id="playingList"></div>
        </div>
        
        <!-- All Friends -->
        <div class="section">
            <div class="section-title">All Friends</div>
            <div id="friendsList"></div>
        </div>
    </div>
    
        <nav class="bottom-nav">
        <a href="{% if demo_mode %}/player/demo/home{% else %}/player/home{% endif %}" class="nav-item"><div class="icon">🎱</div><div>Home</div></a>
        <a href="{% if demo_mode %}/player/demo/friends{% else %}/player/friends{% endif %}" class="nav-item active"><div class="icon">👥</div><div>Friends</div></a>
        <a href="{% if demo_mode %}/player/demo/challenges{% else %}/player/challenges{% endif %}" class="nav-item"><div class="icon">⚔️</div><div>Challenges</div></a>
        <a href="{% if demo_mode %}/player/demo/leaderboards{% else %}/player/leaderboard{% endif %}" class="nav-item"><div class="icon">🏆</div><div>Rankings</div></a>
        <a href="{% if demo_mode %}/player/demo/profile{% else %}/player/profile{% endif %}" class="nav-item"><div class="icon">👤</div><div>Profile</div></a>
    </nav>
    
    <script>
        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const mainContent = document.getElementById('mainContent');
        
        // Load friends data
        async function loadFriends() {
            try {
                const res = await fetch('/api/social/friends');
                const data = await res.json();
                
                if (data.error) {
                    window.location.href = '/auth/login';
                    return;
                }
                
                renderRequests(data.requests || []);
                renderPlaying(data.playing_now || []);
                renderFriends(data.friends || []);
            } catch (e) {
                console.error('Failed to load friends:', e);
            }
        }
        
        function renderRequests(requests) {
            const section = document.getElementById('requestsSection');
            const list = document.getElementById('requestsList');
            const count = document.getElementById('requestCount');
            
            count.textContent = requests.length;
            section.classList.toggle('hidden', requests.length === 0);
            
            list.innerHTML = requests.map(r => `
                <div class="friend-card">
                    <div class="avatar">👤</div>
                    <div class="friend-info">
                        <div class="friend-name">${r.nickname}</div>
                        <div class="friend-status">Wants to be friends</div>
                    </div>
                    <div class="action-btns">
                        <button class="action-btn btn-accept" onclick="respondRequest(${r.id}, true)">Accept</button>
                        <button class="action-btn btn-decline" onclick="respondRequest(${r.id}, false)">✕</button>
                    </div>
                </div>
            `).join('');
        }
        
        function renderPlaying(playing) {
            const section = document.getElementById('playingSection');
            const list = document.getElementById('playingList');
            
            section.classList.toggle('hidden', playing.length === 0);
            
            list.innerHTML = playing.map(p => `
                <div class="friend-card">
                    <div class="avatar">🎱</div>
                    <div class="friend-info">
                        <div class="friend-name">${p.nickname}</div>
                        <div class="friend-status">
                            <span class="status-dot playing"></span>
                            ${p.status === 'playing' ? 'Playing' : 'In queue'} at ${p.bar_name || 'a bar'}
                        </div>
                    </div>
                    <button class="action-btn btn-challenge" onclick="challenge(${p.id})">Challenge</button>
                </div>
            `).join('');
        }
        
        function renderFriends(friends) {
            const list = document.getElementById('friendsList');
            
            if (friends.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👥</div>
                        <p>No friends yet. Search above to add some!</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = friends.map(f => {
                const status = f.activity_status || 'offline';
                const statusText = status === 'playing' ? 'Playing now' : 
                                   status === 'in_queue' ? 'In queue' :
                                   status === 'online' ? 'Online' : 'Offline';
                return `
                    <div class="friend-card">
                        <div class="avatar">👤</div>
                        <div class="friend-info">
                            <div class="friend-name">${f.nickname}</div>
                            <div class="friend-status">
                                <span class="status-dot ${status}"></span>
                                ${statusText}
                            </div>
                            <div class="friend-stats">${f.wins || 0}W - ${f.losses || 0}L • ${f.tokens_balance || 0} tokens</div>
                        </div>
                        <button class="action-btn btn-challenge" onclick="challenge(${f.id})">⚔️</button>
                    </div>
                `;
            }).join('');
        }
        
        // Search
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const q = e.target.value.trim();
            
            if (q.length < 2) {
                searchResults.classList.add('hidden');
                mainContent.classList.remove('hidden');
                return;
            }
            
            searchTimeout = setTimeout(() => searchPlayers(q), 300);
        });
        
        async function searchPlayers(query) {
            try {
                const res = await fetch(`/api/social/players/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                mainContent.classList.add('hidden');
                searchResults.classList.remove('hidden');
                
                if (data.players.length === 0) {
                    searchResults.innerHTML = '<div class="empty-state">No players found</div>';
                    return;
                }
                
                searchResults.innerHTML = data.players.map(p => `
                    <div class="search-result">
                        <div>
                            <div style="font-weight:600;">${p.nickname}</div>
                            <div style="font-size:0.8rem;color:var(--text-secondary);">${p.wins || 0}W - ${p.losses || 0}L</div>
                        </div>
                        <button class="action-btn btn-add" onclick="addFriend(${p.id})">+ Add</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Search failed:', e);
            }
        }
        
        async function addFriend(playerId) {
            try {
                const res = await fetch('/api/social/friends/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ friend_id: playerId })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('Friend request sent!');
                    searchInput.value = '';
                    searchResults.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                } else {
                    alert(data.error || 'Failed to send request');
                }
            } catch (e) {
                alert('Failed to send request');
            }
        }
        
        async function respondRequest(requesterId, accept) {
            try {
                await fetch('/api/social/friends/respond', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ requester_id: requesterId, accept })
                });
                loadFriends();
            } catch (e) {
                alert('Failed to respond');
            }
        }
        
        function challenge(playerId) {
            window.location.href = `/player/challenges?challenge=${playerId}`;
        }
        
        loadFriends();
    </script>
</body>
</html>
