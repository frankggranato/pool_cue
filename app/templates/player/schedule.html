<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg-primary:#09090b;--bg-secondary:#111113;--text-primary:#f4f4f5;--text-secondary:#a1a1aa;--text-muted:#52525b;--accent:#eab308;--border:rgba(255,255,255,0.06);--success:#22c55e}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;padding-bottom:80px}
        .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
        .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text-primary);font-weight:600;font-size:0.95rem}
        .logo-mark{width:28px;height:28px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:#111}
        .content{padding:20px 16px}
        .empty{text-align:center;padding:60px 20px}
        .empty-icon{font-size:3rem;margin-bottom:16px}
        .empty-title{font-size:1.1rem;font-weight:600;margin-bottom:8px}
        .empty-sub{color:var(--text-secondary);font-size:0.85rem;margin-bottom:20px}
        .btn{display:inline-block;padding:12px 24px;background:var(--accent);border-radius:8px;color:#111;font-size:0.9rem;font-weight:600;text-decoration:none}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-primary);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 22px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;color:var(--text-muted);text-decoration:none;font-size:0.6rem;font-weight:500}
        .nav-item .icon{font-size:1.25rem}
        .nav-item.active{color:var(--text-primary)}
    </style>
</head>
<body>
    <div class="header">
        <a href="/player/home" class="logo"><div class="logo-mark">🎱</div><span>Pool Cue</span></a>
    </div>
    
    <div class="content">
        <div class="empty">
            <div class="empty-icon">📅</div>
            <div class="empty-title">No Scheduled Matches</div>
            <div class="empty-sub">Your scheduled matches and challenges will appear here</div>
            <a href="/player/challenges" class="btn">View Challenges</a>
        </div>
    </div>
    
    <nav class="bottom-nav">
        <a href="{% if demo_mode %}/player/demo/home{% else %}/player/home{% endif %}" class="nav-item"><div class="icon">🎱</div><div>Home</div></a>
        <a href="{% if demo_mode %}/player/demo/friends{% else %}/player/friends{% endif %}" class="nav-item"><div class="icon">👥</div><div>Friends</div></a>
        <a href="{% if demo_mode %}/player/demo/challenges{% else %}/player/challenges{% endif %}" class="nav-item"><div class="icon">⚔️</div><div>Challenges</div></a>
        <a href="{% if demo_mode %}/player/demo/leaderboards{% else %}/player/leaderboard{% endif %}" class="nav-item"><div class="icon">🏆</div><div>Rankings</div></a>
        <a href="{% if demo_mode %}/player/demo/profile{% else %}/player/profile{% endif %}" class="nav-item"><div class="icon">👤</div><div>Profile</div></a>
    </nav>
</body>
</html>
