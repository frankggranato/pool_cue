<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Login - Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #111111; --bg-secondary: #1a1a1a; --bg-tertiary: #222222;
            --text-primary: #f2f2f2; --text-secondary: #888888; --text-muted: #555555;
            --accent: #f5c518; --border: rgba(255,255,255,0.08);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
        }
        .dev-link { position: fixed; top: 8px; right: 8px; padding: 6px 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-size: 0.65rem; text-decoration: none; z-index: 1000; }
        
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 { font-size: 2rem; color: var(--accent); }
        .logo p { color: var(--text-secondary); margin-top: 8px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #111; }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span { padding: 0 15px; }
        
        .guest-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <a href="/master" class="dev-link">← Dashboard</a>
    
    <div class="logo">
        <a href="/master" style="text-decoration:none;color:inherit;"><h1>🎱 Pool Cue</h1></a>
        <p>Track your games, build your rating</p>
    </div>
    
    <form action="/player/home" method="GET">
        <div class="form-group">
            <label>Nickname</label>
            <input type="text" name="nickname" placeholder="Enter your nickname" required>
        </div>
        
        <div class="form-group">
            <label>Email (optional)</label>
            <input type="email" name="email" placeholder="For account recovery">
        </div>
        
        <button type="submit" class="btn btn-primary">Get Started</button>
    </form>
    
    <div class="divider"><span>or</span></div>
    
    <a href="/player/demo" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none;">
        🎮 Try Demo Mode
    </a>
    
    <p class="guest-note">
        Explore the app without creating an account.
    </p>
</body>
</html>
