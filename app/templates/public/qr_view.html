<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>{{ bar.name }} - Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #111111; --bg2: #1a1a1a; --bg3: #222222;
            --text: #f2f2f2; --dim: #888888; --muted: #555555;
            --accent: #f5c518; --green: #22c55e; --red: #ef4444;
            --border: rgba(255,255,255,0.08);
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }

        /* Header */
        .header { padding: 14px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.2rem; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
        .logo-mark { width: 26px; height: 26px; background: var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #111; }

        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 14px; background: transparent; border: none; color: var(--muted); font-size: 0.9rem; font-weight: 600; font-family: inherit; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
        .tab.active { color: var(--text); border-bottom-color: var(--accent); }

        /* Tab Content */
        .tab-content { display: none; flex: 1; padding: 24px 20px; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; align-items: center; }

        /* Bar Info */
        .bar-info { text-align: center; margin-bottom: 20px; }
        .bar-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .queue-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; }
        .queue-badge strong { font-size: 1.1rem; color: var(--accent); }
        .queue-badge span { font-size: 0.85rem; color: var(--dim); }

        /* Join Form */
        .join-form { width: 100%; max-width: 360px; }
        .form-label { display: block; font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .form-input { width: 100%; padding: 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; font-family: inherit; margin-bottom: 16px; }
        .form-input:focus { outline: none; border-color: var(--dim); }
        .form-input::placeholder { color: var(--muted); }
        .join-btn { width: 100%; padding: 18px; background: var(--accent); border: none; border-radius: 12px; color: #111; font-size: 1.05rem; font-weight: 700; font-family: inherit; cursor: pointer; }
        .join-btn:active { transform: scale(0.98); }
        .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Success State */
        .success-state { display: none; text-align: center; width: 100%; max-width: 360px; }
        .success-state.show { display: block; }
        .success-check { font-size: 3rem; margin-bottom: 12px; }
        .success-msg { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
        .success-pos { font-size: 0.95rem; color: var(--dim); margin-bottom: 20px; }
        .leave-btn { padding: 12px 24px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; color: var(--dim); font-size: 0.85rem; font-family: inherit; cursor: pointer; }

        /* Queue List */
        .section-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; width: 100%; max-width: 400px; }
        .queue-list { width: 100%; max-width: 400px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .queue-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .queue-item:last-child { border-bottom: none; }
        .queue-pos { width: 28px; height: 28px; background: var(--bg3); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; margin-right: 12px; flex-shrink: 0; }
        .queue-pos.king { background: var(--accent); color: #111; }
        .queue-name { flex: 1; font-weight: 500; }
        .queue-wins { font-size: 0.75rem; color: var(--accent); font-weight: 600; }
        .queue-empty { padding: 32px; text-align: center; color: var(--muted); }

        /* Shot Caller Actions */
        .actions { width: 100%; max-width: 400px; }
        .action-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; font-family: inherit; border: 1px solid; }
        .action-btn.win { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.3); color: var(--green); }
        .action-btn.lose { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); color: var(--red); }
        .action-btn.leave { background: var(--bg2); border-color: var(--border); color: var(--dim); font-weight: 500; }
        .action-icon { font-size: 1.2rem; }

        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; color: white; box-shadow: 0 8px 32px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }

        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
    </style>
</head>
<body>
    <div class="header">
        <span class="logo"><span class="logo-mark">🎱</span>Pool Cue</span>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('join')">Join Queue</button>
        <button class="tab" onclick="showTab('shotcaller')">Shot Caller</button>
    </div>

    <!-- JOIN QUEUE TAB -->
    <div id="join-tab" class="tab-content active">
        <div class="bar-info">
            <h1 class="bar-name">{{ bar.name }}</h1>
            <div class="queue-badge">
                <strong id="joinQueueCount">{{ queue_count }}</strong>
                <span>in queue</span>
            </div>
        </div>

        <form class="join-form" id="joinForm">
            <label class="form-label">Your Name</label>
            <input type="text" name="nickname" class="form-input" placeholder="Enter your name to play" required id="nicknameInput" autocomplete="off">
            <button type="submit" class="join-btn" id="joinBtn">Join Queue</button>
        </form>

        <!-- After joining -->
        <div class="success-state" id="successState">
            <div class="success-check">✅</div>
            <div class="success-msg">You're in!</div>
            <div class="success-pos" id="successPos">Position #3 — estimated wait ~16 min</div>
            <button class="leave-btn" onclick="leaveQueue()">Leave Queue</button>
        </div>

        <!-- Queue preview -->
        <div style="margin-top: 24px; width: 100%; max-width: 400px;" id="joinQueuePreview"></div>
    </div>

    <!-- SHOT CALLER TAB -->
    <div id="shotcaller-tab" class="tab-content">
        <div style="width:100%;max-width:400px;">
            <!-- Now Playing -->
            <div style="padding:14px 18px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:10px;display:flex;align-items:center;gap:12px;margin-bottom:20px;">
                <div style="width:10px;height:10px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;flex-shrink:0;"></div>
                <div>
                    <div style="font-size:0.85rem;font-weight:600;">Now Playing</div>
                    <div style="font-size:0.8rem;color:var(--dim);" id="nowPlaying">Loading...</div>
                </div>
            </div>

            <!-- Record Result -->
            <div class="section-label" style="max-width:100%;">⚡ Record Game Result</div>
            <div class="actions">
                <button class="action-btn win" onclick="recordKingWin()">
                    <span class="action-icon">👑</span> I Won — Stay on Table
                </button>
                <button class="action-btn lose" onclick="recordChallengerWin()">
                    <span class="action-icon">⚔️</span> Challenger Won — Next Up
                </button>
                <button class="action-btn leave" onclick="leaveQueue()">
                    <span class="action-icon">🚪</span> Leave Table
                </button>
            </div>

            <!-- Queue -->
            <div class="section-label" style="max-width:100%;margin-top:24px;">👥 Queue</div>
            <div class="queue-list" id="queueList">
                <div class="queue-empty">
                    <div style="font-size:1.5rem;margin-bottom:8px;">🎱</div>
                    No one in queue — table is open!
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const barId = {{ bar.id }};
        const tableId = {{ table.id if table else 'null' }};
        let inQueue = false;

        // === Tab Switching ===
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        // === Toast ===
        function toast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.background = type === 'success' ? 'rgba(34,197,94,0.95)' : type === 'error' ? 'rgba(239,68,68,0.95)' : 'rgba(59,130,246,0.95)';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        // === Auto-populate name ===
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('poolcue_name');
            if (saved) document.getElementById('nicknameInput').value = saved;
            refreshQueue();
        });

        // === Join Queue ===
        document.getElementById('joinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('nicknameInput').value.trim();
            if (!name) return;

            const btn = document.getElementById('joinBtn');
            btn.disabled = true;
            btn.textContent = 'Joining...';

            localStorage.setItem('poolcue_name', name);

            fetch('/api/queue/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bar_id: barId, table_id: tableId, nickname: name })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    toast(data.error, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Join Queue';
                } else {
                    inQueue = true;
                    document.getElementById('joinForm').style.display = 'none';
                    const ss = document.getElementById('successState');
                    ss.classList.add('show');
                    const wait = data.estimated_wait;
                    document.getElementById('successPos').textContent = 
                        `Position #${data.position}` + (wait > 0 ? ` — estimated wait ~${wait} min` : ' — you\'re up next!');
                    toast('🎱 You\'re in the queue!', 'success');
                    refreshQueue();
                }
            })
            .catch(() => {
                toast('Failed to join. Try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Join Queue';
            });
        });

        // === Refresh Queue ===
        async function refreshQueue() {
            try {
                const url = tableId ? `/api/queue?bar_id=${barId}&table_id=${tableId}` : `/api/queue?bar_id=${barId}`;
                const res = await fetch(url);
                const data = await res.json();
                const q = data.queue || [];

                // Update counts
                document.getElementById('joinQueueCount').textContent = q.length;

                // Update "Now Playing" in shot caller
                const np = document.getElementById('nowPlaying');
                if (q.length >= 2) {
                    np.textContent = `${q[0].nickname || 'Player'} vs ${q[1].nickname || 'Challenger'}`;
                } else if (q.length === 1) {
                    np.textContent = `${q[0].nickname || 'Player'} — waiting for challenger`;
                } else {
                    np.textContent = 'Table is open!';
                }

                // Build queue list HTML
                const listEl = document.getElementById('queueList');
                if (q.length === 0) {
                    listEl.innerHTML = '<div class="queue-empty"><div style="font-size:1.5rem;margin-bottom:8px;">🎱</div>No one in queue — table is open!</div>';
                } else {
                    listEl.innerHTML = q.map((entry, i) => {
                        const name = entry.nickname || entry.player_name || 'Guest';
                        const wins = entry.wins_on_table || 0;
                        return `<div class="queue-item">
                            <div class="queue-pos ${i === 0 ? 'king' : ''}">${i === 0 ? '👑' : i + 1}</div>
                            <div class="queue-name">${name}</div>
                            ${wins > 0 ? `<div class="queue-wins">${wins}W</div>` : ''}
                        </div>`;
                    }).join('');
                }

                // Mirror queue in join tab preview
                const preview = document.getElementById('joinQueuePreview');
                if (q.length > 0 && preview) {
                    preview.innerHTML = `<div class="section-label">👥 Current Queue</div><div class="queue-list">${listEl.innerHTML}</div>`;
                } else if (preview) {
                    preview.innerHTML = '';
                }
            } catch (e) { console.error('Queue refresh failed:', e); }
        }

        // Poll every 2 seconds
        setInterval(refreshQueue, 2000);

        // === Game Results ===
        function recordKingWin() {
            if (!confirm('Record your win? Challenger rotates out.')) return;
            fetch('/api/king-wins', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bar_id: barId })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) { toast('👑 Win recorded!', 'success'); refreshQueue(); }
                else toast(data.error || 'Failed', 'error');
            })
            .catch(() => toast('Connection error', 'error'));
        }

        function recordChallengerWin() {
            if (!confirm('Challenger won? King rotates out, next player up.')) return;
            fetch('/api/challenger-wins', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bar_id: barId })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) { toast('⚔️ New king on the table!', 'success'); refreshQueue(); }
                else toast(data.error || 'Failed', 'error');
            })
            .catch(() => toast('Connection error', 'error'));
        }

        function leaveQueue() {
            if (!confirm('Leave the queue? You\'ll lose your spot.')) return;
            fetch('/api/leave', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bar_id: barId })
            })
            .then(r => r.json())
            .then(() => {
                toast('You left the queue', 'info');
                inQueue = false;
                document.getElementById('joinForm').style.display = '';
                document.getElementById('successState').classList.remove('show');
                document.getElementById('joinBtn').disabled = false;
                document.getElementById('joinBtn').textContent = 'Join Queue';
                refreshQueue();
            })
            .catch(() => toast('Connection error', 'error'));
        }
    </script>
</body>
</html>
