<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pool Cue</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#09090b;color:#e4e4e7;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .container{width:100%;max-width:400px;padding:20px}
        .logo{text-align:center;margin-bottom:30px}
        .logo-icon{font-size:60px}
        .logo-text{font-size:28px;font-weight:700;margin-top:10px}
        .logo-sub{color:#71717a;font-size:14px;margin-top:5px}
        .card{background:#18181b;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:30px}
        .card h2{font-size:20px;margin-bottom:20px;text-align:center}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;color:#a1a1aa;font-size:13px;margin-bottom:6px}
        .form-group input{width:100%;padding:12px 14px;background:#09090b;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e4e4e7;font-size:15px}
        .form-group input:focus{outline:none;border-color:#22c55e}
        .btn{width:100%;padding:14px;background:#22c55e;color:#000;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
        .btn:hover{background:#16a34a}
        .error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;text-align:center}
        .links{text-align:center;margin-top:20px;font-size:14px}
        .links a{color:#22c55e;text-decoration:none}
        .links a:hover{text-decoration:underline}
        .divider{display:flex;align-items:center;margin:20px 0;color:#52525b;font-size:13px}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}
        .divider span{padding:0 12px}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🎱</div>
            <div class="logo-text">Pool Cue</div>
            <div class="logo-sub">Queue management for dive bars</div>
        </div>
        
        <div class="card">
            <h2>Sign In</h2>
            
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            
            <div class="divider"><span>or</span></div>
            
            <div class="links">
                <a href="/auth/signup">Create an account</a>
            </div>
        </div>
    </div>
</body>
</html>
