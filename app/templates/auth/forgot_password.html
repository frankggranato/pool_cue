<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Pool Cue</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#09090b;color:#e4e4e7;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .container{width:100%;max-width:400px;padding:20px}
        .logo{text-align:center;margin-bottom:30px}
        .logo-icon{font-size:60px}
        .card{background:#18181b;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:30px}
        .card h2{font-size:20px;margin-bottom:10px}
        .card p{color:#a1a1aa;font-size:14px;margin-bottom:20px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;color:#a1a1aa;font-size:13px;margin-bottom:6px}
        .form-group input{width:100%;padding:12px 14px;background:#09090b;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e4e4e7;font-size:15px}
        .btn{width:100%;padding:14px;background:#22c55e;color:#000;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .links{text-align:center;margin-top:20px;font-size:14px}
        .links a{color:#22c55e;text-decoration:none}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><div class="logo-icon">🎱</div></div>
        <div class="card">
            <h2>Forgot Password?</h2>
            <p>Enter your email and we'll send you a link to reset your password.</p>
            <form method="POST">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required autofocus>
                </div>
                <button type="submit" class="btn">Send Reset Link</button>
            </form>
            <div class="links"><a href="/auth/login">← Back to login</a></div>
        </div>
    </div>
</body>
</html>
