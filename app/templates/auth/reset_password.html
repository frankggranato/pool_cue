<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Reset Password - Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #111111; --bg-secondary: #1a1a1a; --bg-tertiary: #222222;  --border: rgba(255,255,255,0.1);
            --text-primary: #f2f2f2; --text-secondary: #888888; --text-muted: #555555; --accent: #f5c518; --success: #22c55e;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; padding: 40px 24px;
        }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 { font-size: 2rem; color: var(--accent); }
        .logo p { color: var(--text-secondary); margin-top: 8px; font-size: 0.95rem; }
        
        .error { background: #ff4444; color: white; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 14px 16px;
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-primary); font-size: 1rem; font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        .form-hint { font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; }
        
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #111; margin-bottom: 12px; }
        
        .link { text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.9rem; }
        .link a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="logo">
        <h1>🎱 Pool Cue</h1>
        <p>Enter your reset code</p>
    </div>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label>Reset Code</label>
            <input type="text" name="code" placeholder="Enter 6-digit code" maxlength="6" pattern="[0-9]{6}" required autofocus>
            <p class="form-hint">Check your phone for the reset code</p>
        </div>
        
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" placeholder="Enter new password" required minlength="10">
            <p class="form-hint">At least 10 characters</p>
        </div>
        
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm new password" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
    
    <p class="link">
        <a href="/auth/forgot-password">← Didn't receive code?</a>
    </p>
</body>
</html>
