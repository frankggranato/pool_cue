<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Pool Cue</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#09090b;color:#e4e4e7;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .container{width:100%;max-width:400px;padding:20px}
        .logo{text-align:center;margin-bottom:30px}
        .logo-icon{font-size:60px}
        .card{background:#18181b;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:30px}
        .card h2{font-size:20px;margin-bottom:20px;text-align:center}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;color:#a1a1aa;font-size:13px;margin-bottom:6px}
        .form-group input{width:100%;padding:12px 14px;background:#09090b;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e4e4e7;font-size:15px}
        .btn{width:100%;padding:14px;background:#22c55e;color:#000;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><div class="logo-icon">🎱</div></div>
        <div class="card">
            <h2>Set New Password</h2>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn">Update Password</button>
            </form>
        </div>
    </div>
</body>
</html>
