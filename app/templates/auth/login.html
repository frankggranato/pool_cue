<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>Login - Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #111111; --bg-secondary: #1a1a1a; --bg-tertiary: #222222;  --border: rgba(255,255,255,0.1);
            --text-primary: #f2f2f2; --text-secondary: #888888; --text-muted: #555555; --accent: #f5c518;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; padding: 40px 24px;
        }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 { font-size: 2rem; color: var(--accent); }
        .logo p { color: var(--text-secondary); margin-top: 8px; font-size: 0.95rem; }
        
        .error { background: #ff4444; color: white; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 14px 16px;
            background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px;
            color: var(--text-primary); font-size: 1rem; font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #111; margin-bottom: 12px; }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-demo { 
            background: rgba(168, 85, 247, 0.15); 
            color: #a855f7; 
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-top: 12px;
        }
        .btn-demo:hover { background: rgba(168, 85, 247, 0.25); }
        
        .divider { display: flex; align-items: center; margin: 25px 0; color: var(--text-secondary); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { padding: 0 15px; }
        
        .link { text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.9rem; }
        .link a { color: var(--accent); text-decoration: none; }
        
        .demo-section { margin-top: 30px; padding-top: 20px; border-top: 1px dashed var(--border); }
        .demo-section p { text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="logo">
        <h1>🎱 Pool Cue</h1>
        <p>Welcome back</p>
    </div>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Your email" required autofocus>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Your password">
        </div>
        
        <p style="text-align:right; margin-bottom:16px;">
            <a href="/auth/forgot-password" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none;">Forgot password?</a>
        </p>
        
        <button type="submit" class="btn btn-primary">Log In</button>
    </form>
    
    <div class="divider"><span>new here?</span></div>
    
    <a href="/auth/signup" class="btn btn-secondary" style="display:block; text-align:center; text-decoration:none;">
        Create Account
    </a>
    
    <div class="demo-section">
        <p>🎮 Want to explore without signing up?</p>
        <a href="/player/demo" class="btn btn-demo" style="display:block; text-align:center; text-decoration:none;">
            Try Demo Mode
        </a>
    </div>
</body>
</html>
