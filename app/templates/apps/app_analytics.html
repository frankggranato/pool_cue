<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eab308">
    <title>Pool Cue - Master Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="main-frame"></iframe>
    <script>
        var frame = document.getElementById('main-frame');
        
        // Load saved page or default
        var saved = localStorage.getItem('masterPage');
        frame.src = (saved && saved.indexOf('/master') === 0) ? saved : '/master/';
        
        // Save current page every 500ms
        setInterval(function() {
            try {
                var path = frame.contentWindow.location.pathname + frame.contentWindow.location.search;
                if (path.indexOf('/master') === 0) {
                    localStorage.setItem('masterPage', path);
                }
            } catch(e) {}
        }, 500);
    </script>
</body>
</html>
