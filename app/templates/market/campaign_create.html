<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Campaign - Pool Cue Advertiser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#09090b;--card:#0f0f12;--border:rgba(255,255,255,0.08);--t1:#f4f4f5;--t2:#a1a1aa;--t3:#52525b;--gold:#eab308;--green:#22c55e}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:12px}
        .nav{display:flex;align-items:center;gap:24px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--card)}
        .nav-logo{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px;color:var(--t1);text-decoration:none}
        .nav-links{display:flex;gap:20px;margin-left:24px}
        .nav-links a{color:var(--t2);text-decoration:none;font-size:0.8rem;font-weight:500}
        .nav-links a:hover,.nav-links a.active{color:var(--gold)}
        .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px}
        .credits{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);padding:4px 10px;border-radius:4px;font-size:0.7rem;color:var(--green);font-weight:600}
        .btn{padding:8px 16px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--t2);text-decoration:none}
        .btn:hover{border-color:var(--gold);color:var(--gold)}
        .btn-primary{background:var(--gold);border-color:var(--gold);color:#000}
        .container{max-width:700px;margin:0 auto;padding:20px}
        .back{color:var(--t3);text-decoration:none;font-size:0.75rem;display:inline-flex;align-items:center;gap:4px;margin-bottom:16px}
        .back:hover{color:var(--gold)}
        .header{margin-bottom:20px}
        .header h1{font-size:1.2rem;font-weight:600}
        .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
        .card-title{font-size:0.7rem;color:var(--t3);text-transform:uppercase;margin-bottom:12px;font-weight:600}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:0.75rem;color:var(--t2);margin-bottom:6px;font-weight:500}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:0.85rem;font-family:inherit}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--gold)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .placement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .placement-option{padding:12px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s}
        .placement-option:hover{border-color:rgba(255,255,255,0.15)}
        .placement-option.selected{border-color:var(--gold);background:rgba(234,179,8,0.1)}
        .placement-option input{display:none}
        .placement-name{font-weight:600;font-size:0.85rem;margin-bottom:4px}
        .placement-price{font-size:0.7rem;color:var(--gold)}
        .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/market/dashboard" class="nav-logo">🎱 Pool Cue <span style="font-weight:400;color:var(--t3);margin-left:6px">Advertiser</span></a>
        <div class="nav-links">
            <a href="/market/dashboard">Dashboard</a>
            <a href="/market/campaigns" class="active">Campaigns</a>
            <a href="/market/billing">Billing</a>
            <a href="/market/pricing">Pricing</a>
        </div>
        <div class="nav-right">
            <span class="credits">${{ '%.2f'|format(marketer.credits_balance or 0) }} credits</span>
            <a href="/market/logout" class="btn" style="padding:5px 10px">Logout</a>
        </div>
    </nav>

    <div class="container">
        <a href="/market/campaigns" class="back">← Back to Campaigns</a>
        <div class="header"><h1>📢 Create Campaign</h1></div>
        
        <form method="POST">
            <div class="card">
                <div class="card-title">Campaign Details</div>
                <div class="form-group">
                    <label>Campaign Name *</label>
                    <input type="text" name="name" required placeholder="e.g. Summer Promo 2024">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" name="start_date">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" name="end_date">
                    </div>
                </div>
                <div class="form-group">
                    <label>Daily Budget ($)</label>
                    <input type="number" name="budget" step="0.01" placeholder="25.00">
                </div>
            </div>

            <div class="card">
                <div class="card-title">Select Placements</div>
                <div class="placement-grid">
                    {% for p in placements %}
                    <label class="placement-option">
                        <input type="checkbox" name="placements" value="{{ p.code }}">
                        <div class="placement-name">{{ p.name }}</div>
                        <div class="placement-price">${{ p.cpm }} CPM</div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="actions">
                <a href="/market/campaigns" class="btn">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Campaign</button>
            </div>
        </form>
    </div>

    <script>
        document.querySelectorAll('.placement-option').forEach(opt => {
            opt.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    const cb = this.querySelector('input');
                    cb.checked = !cb.checked;
                }
                this.classList.toggle('selected', this.querySelector('input').checked);
            });
        });
    </script>
</body>
</html>
