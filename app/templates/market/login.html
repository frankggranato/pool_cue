<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertise with Pool Cue</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#09090b;--card:#0f0f12;--border:rgba(255,255,255,0.08);--t1:#f4f4f5;--t2:#a1a1aa;--t3:#52525b;--gold:#eab308;--green:#22c55e}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .container{width:100%;max-width:400px}
        .logo{text-align:center;margin-bottom:24px}
        .logo-icon{font-size:2.5rem;margin-bottom:8px}
        .logo-text{font-size:1.25rem;font-weight:700}
        .logo-sub{font-size:0.75rem;color:var(--t2);margin-top:4px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px}
        .card h2{font-size:1rem;font-weight:600;margin-bottom:16px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:0.7rem;color:var(--t2);margin-bottom:6px;font-weight:500}
        .form-group input,.form-group select{width:100%;padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:0.85rem;font-family:inherit}
        .form-group input:focus{outline:none;border-color:var(--gold)}
        .btn{width:100%;padding:12px;background:var(--gold);border:none;border-radius:6px;color:#000;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:inherit}
        .btn:hover{background:#d4a90a}
        .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:10px;border-radius:6px;font-size:0.75rem;margin-bottom:16px}
        .links{text-align:center;margin-top:16px;font-size:0.75rem;color:var(--t3)}
        .links a{color:var(--gold);text-decoration:none}
        .links a:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🎱</div>
            <div class="logo-text">Pool Cue</div>
            <div class="logo-sub">Advertiser Portal</div>
        </div>
        
        <div class="card">
            <h2>Sign In</h2>
            
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            
            <form method="POST" novalidate>
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" name="email" required placeholder="you@company.com or 'beta'">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            
            <div class="links">
                Don't have an account? <a href="/market/signup">Create one</a>
            </div>
        </div>
        
        <div class="links" style="margin-top:24px">
            <a href="/market/pricing">View Pricing</a> · <a href="/">Back to Pool Cue</a>
        </div>
    </div>
</body>
</html>
